<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NimBold — independent developer building thoughtful software." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f1ed" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('nimbold-theme-override')
          const theme = storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
    <title>NimBold — Independent Developer</title>
  </head>
  <body>
    <div id="root">
      <main class="site-fallback" aria-labelledby="fallback-title">
        <p>N° · Independent developer</p>
        <h1 id="fallback-title">Building quiet, useful software.</h1>
        <p>
          NimBold builds thoughtful desktop tools, secure browser integrations,
          and dependable product systems.
        </p>
        <nav aria-label="Portfolio projects">
          <a href="https://github.com/nimbold/Firelink">Firelink</a>
          <a href="https://github.com/nimbold/Firelink-Extension">Firelink Companion</a>
          <a href="https://github.com/nimbold/LifeXP">LifeXP</a>
        </nav>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
